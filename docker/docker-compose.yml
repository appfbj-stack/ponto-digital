# ============================================================================
# KAIROS PONTO - Docker Compose
# ============================================================================
# IMPORTANTE: Este projeto NÃO cria um PostgreSQL próprio.
# Ele se conecta ao PostgreSQL CENTRAL existente no VPS.
# Configure DATABASE_URL no .env apontando para o banco central.
# ============================================================================

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: kairos-ponto-api
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3001:3001"
    networks:
      - kairos-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: kairos-ponto-web
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - kairos-net

  employee:
    build:
      context: ..
      dockerfile: docker/employee.Dockerfile
    container_name: kairos-ponto-employee
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3002:3002"
    depends_on:
      - api
    networks:
      - kairos-net

  super-admin:
    build:
      context: ..
      dockerfile: docker/super-admin.Dockerfile
    container_name: kairos-ponto-super-admin
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "3003:3003"
    depends_on:
      - api
    networks:
      - kairos-net

networks:
  kairos-net:
    driver: bridge
